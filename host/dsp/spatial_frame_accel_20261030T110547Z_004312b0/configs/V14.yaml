agc:
  attack_ms: 20
  enabled: true
  limiter_level_dbfs: -1
  maximum_attenuation_db: -20
  maximum_gain_db: 20
  release_ms: 300
  target_level_dbfs: -24
algorithm_reference: honokawings/MicArray@aa281b34b041e098b8ccb9dd56afca5587b0dd91
bandpass:
  enabled: true
  high_hz: 8000
  low_hz: 100
channel_mapping: identity_in_GitHub_channel_order; physical front/back orientation
  remains to be independently checked
directions:
  A:
    azimuth_deg: 0.0
    elevation_deg: 0.0
  B1:
    azimuth_deg: -30.0
    elevation_deg: 0.0
  B2:
    azimuth_deg: 30.0
    elevation_deg: 0.0
input_contract: 48 channel sample-major signed32 little endian containing sign-extended
  signed24; original DSP applies arithmetic >>8, /32768 and clamp. Do not use generic
  WAV full-scale normalization.
logmmse:
  enabled: true
  fft_size: 2048
  minimum_gain_db: -20
  noise_power_smoothing: 0.95
  overlap_ratio: 0.5
  prior_snr_smoothing: 0.98
monitoring_metadata_only:
  applied_to_probe_stage_output: false
  monitor_buffer_ms: 250
  monitor_gain_db: 39
post_processing_order:
- bandpass
- logmmse
- agc
profile_description: Reference fixed two-point spatial and BP/LogMMSE/AGC processing
  parameters.
sample_rate_hz: 48000
schema_version: 1
state_policy: fresh DSP instances at clip start; continuous state across 200-sample
  input packets; no zero-padding flush at clip end
wiener:
  algorithm: fixed
  b1_coefficient: 5
  b2_coefficient: 5
  mode: twoPoint
  single_coefficient: 8.5
